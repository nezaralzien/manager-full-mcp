[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manager-full-mcp"
version = "1.0.0"
description = "Full-surface MCP server for Manager.io with per-resource permission checkboxes and multi-business support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
manager-full-mcp = "manager_full_mcp.server:main"
manager-full-panel = "manager_full_mcp.panel:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/manager_full_mcp"]
